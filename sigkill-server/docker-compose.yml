services:
  redis:
    image: redis:7-alpine
    container_name: sigkill-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigkill-server
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      LOGGING_FILE_NAME: /var/log/sigkill/app.log
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul -Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs -XX:+ExitOnOutOfMemoryError
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./runtime-logs:/var/log/sigkill
