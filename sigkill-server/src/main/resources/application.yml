spring:
  application:
    name: sigkill-server
  session:
    redis:
      flush-mode: on_save
      namespace: spring:session
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

# Session Configuration
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: none # TODO: change to strict after development
        secure: true
        path: /
      timeout: 24h

logging:
  file:
    name: /var/log/sigkill/app.log

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
