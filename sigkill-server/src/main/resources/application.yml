spring:
  application:
    name: sigkill-server
  session:
    redis:
      flush-mode: on_save
      namespace: spring:session
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

# Session Configuration
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        path: /
      timeout: 24h

logging:
  file:
    name: /var/log/sigkill/app.log
  level:
    com.gulab.sigkillserver.config.websocket.StompEventListener: DEBUG
    com.gulab.sigkillserver.config.security.StompHandler: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    permit-all-paths:
      - /api/v1/users/guest-login
      - /actuator/health
      - /actuator/health/**
      - /actuator/prometheus
      - /ws/**
