<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Room WS Test</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 720px;
            margin: 24px auto;
            padding: 0 12px;
        }

        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        input, button {
            padding: 8px;
            font-size: 14px;
        }

        input {
            flex: 1 1 220px;
        }

        #log {
            white-space: pre-wrap;
            border: 1px solid #ccc;
            min-height: 260px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
        }

        #roomsView {
            white-space: pre-wrap;
            border: 1px solid #ccc;
            min-height: 120px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<h2>Room WebSocket 테스트 (실서비스 흐름)</h2>

<div class="row">
    <button id="seedRoomsBtn">테스트 데이터 생성 (유저20 + 4/6, 6/6, 2/6 방)</button>
</div>

<div class="row">
    <input id="serverBase" placeholder="server base URL" type="text" value="http://localhost:8080"/>
</div>

<div class="row">
    <input id="roomId" placeholder="참가할 roomId 입력 (예: 6187)" type="number" value="1"/>
</div>

<div class="row">
    <button id="loginBtn">1) guest-login</button>
    <button id="loadRoomsBtn">2) 방 목록 조회</button>
</div>

<pre id="roomsView">방 목록을 불러와서 roomId를 확인한 뒤 위 입력칸에 직접 입력하세요.</pre>

<div class="row">
    <button id="connectBtn">3) connect + subscribe + join</button>
</div>

<div class="row">
    <input id="message" placeholder="전송할 메시지" type="text"/>
    <button id="sendBtn">4) send</button>
</div>

<pre class="chat-box" id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/stompjs@2/lib/stomp.min.js"></script>
<script src="script.js"></script>
</body>
</html>
