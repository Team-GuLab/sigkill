name: Deploy sigkill-client (prod)

on:
  push:
    branches:
      - main
    paths:
      - client/**
      - .github/workflows/deploy-sigkill-client-main.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build client
        working-directory: client
        env:
          VITE_WS_URL: ${{ secrets.VITE_WS_URL_PROD }}
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  deploy:
    name: Deploy to prod server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          set -euo pipefail

          [ -n "${{ secrets.PROD_WAS_HOST }}" ] || { echo "PROD_WAS_HOST secret is required"; exit 1; }
          [ -n "${{ secrets.OCI_USER }}" ] || { echo "OCI_USER secret is required"; exit 1; }
          [ -n "${{ secrets.OCI_SSH_KEY }}" ] || { echo "OCI_SSH_KEY secret is required"; exit 1; }

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: dist

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_WAS_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: dist/
          target: /tmp/sigkill-client/

      - name: Swap static files and reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_WAS_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e

            DEPLOY_DIR=/var/www/sigkill/html
            STAGING_DIR=/tmp/sigkill-client/dist

            sudo mkdir -p "$(dirname "$DEPLOY_DIR")"
            sudo rm -rf "$DEPLOY_DIR"
            sudo mv "$STAGING_DIR" "$DEPLOY_DIR"
            rm -rf /tmp/sigkill-client

            sudo nginx -t
            sudo systemctl reload nginx
