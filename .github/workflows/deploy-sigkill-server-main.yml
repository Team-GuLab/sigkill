name: Deploy sigkill-server (prod)

on:
  push:
    branches:
      - main
    paths:
      - sigkill-server/**
      - .github/workflows/deploy-sigkill-server-main.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sigkill-server
  APP_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sigkill-server:sha-${{ github.sha }}
  CHANNEL_TAG: latest
  PROD_WAS_HOST: ${{ secrets.PROD_WAS_HOST }}
  PROD_REDIS_HOST: ${{ secrets.PROD_REDIS_HOST }}
  SSH_USER: ${{ secrets.OCI_USER }}
  SSH_KEY: ${{ secrets.OCI_SSH_KEY }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build JAR
        working-directory: sigkill-server
        run: ./gradlew test bootJar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=${{ env.CHANNEL_TAG }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./sigkill-server
          file: ./sigkill-server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to prod instances
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate prod deployment secrets
        run: |
          set -euo pipefail

          [ -n "${PROD_WAS_HOST:-}" ] || { echo "PROD_WAS_HOST secret is required"; exit 1; }
          [ -n "${SSH_USER:-}" ] || { echo "OCI_USER secret is required"; exit 1; }
          [ -n "${SSH_KEY:-}" ] || { echo "OCI_SSH_KEY secret is required"; exit 1; }
          [ -n "${PROD_REDIS_HOST:-}" ] || { echo "PROD_REDIS_HOST secret is required for the app to reach Redis"; exit 1; }
          [ -n "${{ secrets.REDIS_PASSWORD }}" ] || { echo "REDIS_PASSWORD secret is required"; exit 1; }

      - name: Upload prod app compose to was-1
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.PROD_WAS_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          source: sigkill-server/deploy/prod/app/docker-compose.yml
          target: /home/${{ env.SSH_USER }}/sigkill-server-deploy
          strip_components: 4

      - name: Deploy app to was-1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.PROD_WAS_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            cd /home/${{ env.SSH_USER }}/sigkill-server-deploy
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            APP_IMAGE="${{ env.APP_IMAGE }}" \
            SPRING_PROFILES_ACTIVE="prod" \
            SPRING_DATA_REDIS_HOST="${{ env.PROD_REDIS_HOST }}" \
            SPRING_DATA_REDIS_PORT="6379" \
            SPRING_DATA_REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            docker compose -f docker-compose.yml up -d --pull always --remove-orphans
