name: Deploy sigkill-server (dev)

on:
  push:
    branches:
      - develop
    paths:
      - sigkill-server/**
      - .github/workflows/deploy-sigkill-server-develop.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sigkill-server
  APP_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sigkill-server:sha-${{ github.sha }}
  CHANNEL_TAG: develop
  DEV_HOST: ${{ secrets.OCI_DEV_HOST }}
  SSH_USER: ${{ secrets.OCI_USER }}
  SSH_KEY: ${{ secrets.OCI_SSH_KEY }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Set up the build environment
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 3) Build application artifact
      - name: Test and build JAR
        working-directory: sigkill-server
        run: ./gradlew test bootJar

      # 4) Authenticate and publish image
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=${{ env.CHANNEL_TAG }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./sigkill-server
          file: ./sigkill-server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to dev instance
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate develop deployment secrets
        run: |
          set -euo pipefail

          [ -n "${DEV_HOST:-}" ] || { echo "OCI_DEV_HOST secret is required"; exit 1; }
          [ -n "${SSH_USER:-}" ] || { echo "OCI_USER secret is required"; exit 1; }
          [ -n "${SSH_KEY:-}" ] || { echo "OCI_SSH_KEY secret is required"; exit 1; }

      - name: Upload deploy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEV_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          source: sigkill-server/deploy/dev/docker-compose.yml
          target: /home/${{ env.SSH_USER }}/sigkill-server-deploy
          strip_components: 3

      - name: Deploy app and Redis to dev
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEV_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            cd /home/${{ env.SSH_USER }}/sigkill-server-deploy
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            APP_IMAGE="${{ env.APP_IMAGE }}" docker compose -f docker-compose.yml up -d --pull always --remove-orphans
