name: Deploy sigkill-server develop to OCI (compose)

on:
  push:
    branches: ["develop"]
    paths:
      - "sigkill-server/**"
      - ".github/workflows/deploy-sigkill-server-develop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build jar
        working-directory: sigkill-server
        run: ./gradlew test bootJar

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sigkill-server:${{ github.sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./sigkill-server
          file: ./sigkill-server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sigkill-server:develop

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to OCI with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e

            mkdir -p /opt/sigkill
            cd /opt/sigkill

            cat > docker-compose.prod.yml <<'EOF'
            services:
              app:
                image: ${APP_IMAGE}
                container_name: sigkill-server
                restart: unless-stopped
                ports:
                  - "8080:8080"
                environment:
                  SPRING_PROFILES_ACTIVE: dev
            EOF

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            APP_IMAGE="${{ needs.build-and-push.outputs.image }}" docker compose -f docker-compose.prod.yml pull app
            APP_IMAGE="${{ needs.build-and-push.outputs.image }}" docker compose -f docker-compose.prod.yml up -d app

            docker image prune -f
