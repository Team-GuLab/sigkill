name: Deploy sigkill-server (develop)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - sigkill-server/**
      - .github/workflows/deploy-sigkill-server-develop.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sigkill-server
  APP_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/sigkill-server:sha-${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Set up the build environment
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 3) Build application artifact
      - name: Test and build JAR
        working-directory: sigkill-server
        run: ./gradlew test bootJar

      # 4) Authenticate and publish image
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=develop

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./sigkill-server
          file: ./sigkill-server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to OCI server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload deploy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: sigkill-server/deploy/docker-compose.deploy.yml
          target: /home/${{ secrets.OCI_USER }}/sigkill-server-deploy
          strip_components: 2

      # 1) Pull and restart the app container on OCI
      - name: Deploy via Docker CLI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker pull "${{ env.APP_IMAGE }}"
            docker pull redis:7-alpine

            docker stop sigkill-server || true
            docker rm sigkill-server || true
            docker stop sigkill-redis || true
            docker rm sigkill-redis || true

            sudo mkdir -p /var/log/sigkill
            mkdir -p /home/${{ secrets.OCI_USER }}/sigkill-server-deploy

            cd /home/${{ secrets.OCI_USER }}/sigkill-server-deploy
            APP_IMAGE="${{ env.APP_IMAGE }}" docker compose -f docker-compose.deploy.yml up -d --remove-orphans

            docker image prune -f
